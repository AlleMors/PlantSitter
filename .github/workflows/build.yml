name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e nodemcuv2
      - name: Build filesystem (web UI)
        run: pio run -e nodemcuv2 -t buildfs
      - name: Build debug variant
        run: pio run -e nodemcuv2-debug
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/nodemcuv2/firmware.bin
            .pio/build/nodemcuv2/littlefs.bin
          if-no-files-found: error

; =====================================================================
; PlantSitter - Centralina di irrigazione smart 8 zone per ESP8266
; =====================================================================
; Hardware:
;   - ESP8266EX 4MB (NodeMCU Lolin v3 / clone CH340)
;   - RTC DS3231 su I2C
;   - Scheda relè 8 canali con ingresso logico IN1..IN8 + VCC + GND
;   - Elettrovalvole 24V AC con proprio trasformatore
;
; Comandi principali:
;   pio run                    -> compila
;   pio run -t upload          -> flash firmware
;   pio run -t uploadfs        -> flash LittleFS (UI web)
;   pio run -t upload -t monitor -> flash + apri seriale
; =====================================================================

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600   ; CH340 robusto a 921600; abbassa a 460800 se fallisce

board_build.filesystem = littlefs
board_upload.flash_size = 4MB
; ATTENZIONE: su ESP8266 non esiste una "partition table" (partitions.csv non
; è letta dal core). Il layout è fissato dal linker script della board
; (eagle.flash.4m1m.ld), che qui significa:
;   sketch 0x00000, max 1044464 B (~1019 KB)
;   libero 0x100000..0x500000 per l'immagine OTA
;   LittleFS 0x500000..0x5FA000 (1000 KB)
; Per più spazio al filesystem si cambi ldscript in
; eagle.flash.4m2m.ld / 4m3m.ld, ma l'OTA ha bisogno che lo sketch sia
; abbastanza piccolo da stare nella metà inferiore della flash.

build_flags =
    -D PLATFORMIO_BUILD
    -D ARDUINOJSON_USE_LONG_LONG=0
    -Wall -Wextra
    -I include

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ; Fork ESPHome: è la variante mantenuta e testata per ESP8266 (la v3.x
    ; di esp32async è pensata per ESP32 e su 8266 il listener non parte).
    esphome/AsyncTCP-esphome@^2.0.0
    esphome/ESPAsyncWebServer-esphome@^3.0.0
    tzapu/WiFiManager@^2.0.17
    adafruit/RTClib@^2.1.4

lib_ldf_mode = chain+

; Logging asincrono e watchdog di sistema
monitor_filters = esp8266_exception_decoder, time

[env:nodemcuv2-debug]
; Firmware di sviluppo: seriale USB attiva, relè spostati per non occupare RX/TX.
; Solo per bring-up in laboratorio.
extends = env:nodemcuv2
build_flags =
    ${env:nodemcuv2.build_flags}
    -D PLANTSITTER_DEBUG_SERIAL
    -D PLANTSITTER_DEBUG_BUILD
    -D CORE_DEBUG_LEVEL=3

